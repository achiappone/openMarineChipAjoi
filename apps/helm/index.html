<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1622" />
    <title>openMarine Helm</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b1622; }
      /* Kiosk: block browser pinch-zoom / double-tap-zoom of the helm UI (pan still
         works for scrolling). The Plotter's map zoom is JS-handled inside its own
         iframe, so it's unaffected. */
      html, body, #root { touch-action: pan-x pan-y; overscroll-behavior: none; }
      * { box-sizing: border-box; }
      /* Touchscreen: hide the mouse cursor everywhere in the app. */
      *, *::before, *::after { cursor: none !important; }
      @keyframes eq { 0% { transform: scaleY(0.15); } 100% { transform: scaleY(var(--amp, 0.8)); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
