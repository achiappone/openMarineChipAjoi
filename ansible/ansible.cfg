# Quiet ansible-core deprecation noise coming from the posix collection.
# (npm scripts pass -i ansible/hosts explicitly; this just cleans output.)
[defaults]
inventory = hosts
deprecation_warnings = False
host_key_checking = False
timeout = 30

[ssh_connection]
# Keep multiplexing (fast) but never prompt and fail fast instead of hanging forever.
# pipelining cuts SSH round-trips per task — steadier over wifi.
# AddressFamily=inet forces IPv4 — openplotter.local's IPv6 link-local address
# accepts the TCP connect but stalls at SSH key exchange, hanging the whole run.
ssh_args = -o AddressFamily=inet -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
